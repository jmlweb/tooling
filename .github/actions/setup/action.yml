name: 'Setup Environment'
description: 'Common setup steps for CI jobs: pnpm, Node.js, and dependencies'

inputs:
  install-strategy:
    description: 'Install strategy: frozen (default) or update'
    required: false
    default: 'frozen'

runs:
  using: 'composite'
  steps:

    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.26.2

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: |
        if [ "${{ inputs.install-strategy }}" == "frozen" ]; then
          pnpm install --frozen-lockfile
        else
          pnpm install --no-frozen-lockfile
        fi
