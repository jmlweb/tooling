version: 2
updates:
  # Enable version updates for npm dependencies in root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Open up to 10 PRs at once for patch/minor updates
    open-pull-requests-limit: 10
    # Automatically ignore major version updates (requires manual review)
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Starlight 0.41+ and starlight-llms-txt 0.11+ require Astro 7. Remove
      # these entries once apps/docs is migrated to Astro 7.
      - dependency-name: "@astrojs/starlight"
        versions: [">=0.41.0"]
      - dependency-name: "starlight-llms-txt"
        versions: [">=0.11.0"]
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    # react and react-dom must be the exact same version at runtime, so bump them together
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # vitest and its sibling packages declare exact-version peers on each other
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"
