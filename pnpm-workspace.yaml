packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  'postcss-selector-parser@>=7 <7.1.6': '>=7.1.6'
  'postcss-selector-parser@<7.1.6': '>=7.1.6'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'

# No patched release exists for these; both are build/test-time only transitive dependencies.
# Remove an entry once the advisory has a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces, via starlight-llms-txt
    - GHSA-hp3w-g68c-fv3c # sprintf-js, via jest

minimumReleaseAgeExclude:
  - '@astrojs/check@0.9.12'
  - '@astrojs/language-server@2.17.3'
  - '@astrojs/markdown-satteri@0.4.5'
  - '@astrojs/prism@4.1.1'
  - '@astrojs/telemetry@3.4.1'
  - '@eslint-react/ast@5.28.4'
  - '@eslint-react/core@5.28.4'
  - '@eslint-react/eslint-plugin@5.28.4'
  - '@eslint-react/eslint@5.28.4'
  - '@eslint-react/jsx@5.28.4'
  - '@eslint-react/shared@5.28.4'
  - '@eslint-react/var@5.28.4'
  - astro@7.4.2
  - eslint-plugin-react-dom@5.28.4
  - eslint-plugin-react-jsx@5.28.4
  - eslint-plugin-react-naming-convention@5.28.4
  - eslint-plugin-react-rsc@5.28.4
  - eslint-plugin-react-web-api@5.28.4
  - eslint-plugin-react-x@5.28.4
  - vite@8.3.5

# pnpm 11+ fails install on unreviewed build scripts. None of these need theirs:
# esbuild and unrs-resolver ship prebuilt binaries as optional dependencies,
# and @parcel/watcher is only used by watch mode. pnpm 10 skipped them too.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
