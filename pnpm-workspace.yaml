packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  'postcss-selector-parser@>=7 <7.1.6': '>=7.1.6'
  'postcss-selector-parser@<7.1.6': '>=7.1.6'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  # rolldown 1.3.0's WASM binding depends on @emnapi/*@2.0.0-beta.2. pnpm then
  # resolves the astro check WASM binding's peer to that beta runtime next to a
  # 1.x core, which crashes `astro check`. Keep @emnapi on the stable line;
  # remove once @emnapi 2.x is stable.
  '@emnapi/core@2.0.0-beta.2': '^1.11.3'
  '@emnapi/runtime@2.0.0-beta.2': '^1.11.3'

# No patched release exists for these; both are build/test-time only transitive dependencies.
# Remove an entry once the advisory has a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces, via starlight-llms-txt
    - GHSA-hp3w-g68c-fv3c # sprintf-js, via jest

minimumReleaseAgeExclude:
  - '@astrojs/check@0.9.12'
  - '@astrojs/language-server@2.17.3'
  - '@astrojs/markdown-satteri@0.4.5'
  - '@astrojs/prism@4.1.1'
  - '@astrojs/telemetry@3.4.1'
  - '@eslint-react/ast@5.28.4 || 5.30.6'
  - '@eslint-react/core@5.28.4 || 5.30.6'
  - '@eslint-react/eslint-plugin@5.28.4 || 5.30.6'
  - '@eslint-react/eslint@5.28.4 || 5.30.6'
  - '@eslint-react/jsx@5.28.4 || 5.30.6'
  - '@eslint-react/shared@5.28.4 || 5.30.6'
  - '@eslint-react/var@5.28.4 || 5.30.6'
  - astro@7.4.2
  - eslint-plugin-react-dom@5.28.4 || 5.30.6
  - eslint-plugin-react-jsx@5.28.4 || 5.30.6
  - eslint-plugin-react-naming-convention@5.28.4 || 5.30.6
  - eslint-plugin-react-rsc@5.28.4 || 5.30.6
  - eslint-plugin-react-web-api@5.28.4 || 5.30.6
  - eslint-plugin-react-x@5.28.4 || 5.30.6
  - vite@8.3.5
  - lint-staged@17.6.2
  - syncpack-darwin-arm64@15.3.4
  - syncpack-darwin-x64@15.3.4
  - syncpack-linux-arm64-musl@15.3.4
  - syncpack-linux-arm64@15.3.4
  - syncpack-linux-x64-musl@15.3.4
  - syncpack-linux-x64@15.3.4
  - syncpack-windows-arm64@15.3.4
  - syncpack-windows-x64@15.3.4
  - syncpack@15.3.4

# pnpm 11+ fails install on unreviewed build scripts. None of these need theirs:
# esbuild and unrs-resolver ship prebuilt binaries as optional dependencies,
# and @parcel/watcher is only used by watch mode. pnpm 10 skipped them too.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
